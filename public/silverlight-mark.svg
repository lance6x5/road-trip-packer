<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="Silverlight DevTech">
  <!-- Silverlight DevTech company mark: a periodic-table tile for silver (Ag, element 47). Same design as the Zenith footer. -->
  <defs>
    <linearGradient id="ag-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2b2e"/><stop offset="1" stop-color="#1a1b1d"/></linearGradient>
    <linearGradient id="ag-sym" x1="0" y1="0" x2=".55" y2="1"><stop offset="0" stop-color="#f1f3f5"/><stop offset="1" stop-color="#9ea3aa"/></linearGradient>
  </defs>
  <rect x=".75" y=".75" width="38.5" height="38.5" rx="7" fill="url(#ag-bg)" stroke="#c9cdd3" stroke-width="1.5"/>
  <line x1="7" y1="1.6" x2="33" y2="1.6" stroke="#fff" stroke-opacity=".12"/>
  <text x="5" y="11" font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif" font-size="8.8" font-weight="700" fill="#a7abb2">47</text>
  <text x="20" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif" font-size="17.6" font-weight="800" fill="url(#ag-sym)">Ag</text>
</svg>
