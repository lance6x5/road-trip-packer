<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trunkful: every bag, every traveler, one checklist. Road trip packing lists for the whole family, shareable by link." />
    <meta name="theme-color" content="#1e1b4b" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Trunkful: Road Trip Packing List</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="app-header no-print">
      <a href="#/" class="brand" aria-label="Trunkful home"><img src="/icon.svg" alt="" width="36" height="36" /><span>Trunkful</span></a>
      <span class="tagline">Every bag, every traveler, one checklist.</span>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="app-footer no-print">
      <p><span>Trunkful <span id="app-version"></span></span> · Data stays in your browser.</p>
      <details class="feedback" id="feedback">
        <summary class="btn small">Feedback</summary>
        <div class="feedback-panel">
          <ul class="feedback-actions" aria-label="Feedback options">
            <li><a class="btn small" data-feedback="bug" href="https://github.com/lance6x5/road-trip-packer/issues/new?template=bug_report.yml" target="_blank" rel="noopener">Report a bug</a></li>
            <li><a class="btn small" data-feedback="feature" href="https://github.com/lance6x5/road-trip-packer/issues/new?template=feature_request.yml" target="_blank" rel="noopener">Request a feature</a></li>
          </ul>
          <p class="feedback-note">Opens GitHub — a free GitHub account is required. Don't include personal data.</p>
        </div>
      </details>
    </footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
